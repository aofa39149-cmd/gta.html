<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حاسب تقديرك - Seif</title>
<style>
  body{font-family:tahoma;background:#0f172a;color:white;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
  .card{background:#1e293b;padding:25px;border-radius:20px;width:90%;max-width:350px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  input{width:90%;padding:12px;border-radius:10px;border:none;font-size:18px;text-align:center;margin:15px 0}
  button{background:#38bdf8;color:#000;padding:12px 20px;border:none;border-radius:10px;font-weight:bold;font-size:18px;width:100%;cursor:pointer}
  #result{margin-top:20px;font-size:22px;font-weight:bold;min-height:30px}
</style>
</head>
<body>
<div class="card">
  <h2>🎓 اعرف تقديرك</h2>
  <p>اكتب معدلك التراكمي</p>
  <input id="gpa" type="number" step="0.01" placeholder="مثال: 3.2 او 85">
  <button onclick="calc()">اعرف تقديرك</button>
  <div id="result"></div>
</div>
<script>
function calc(){
  let v=parseFloat(document.getElementById('gpa').value);
  let r=document.getElementById('result');
  if(isNaN(v)){r.innerHTML="اكتب رقم صحيح";return;}
  let t="";
  if(v<=4){ // GPA
    if(v>=3.7) t="ممتاز مع مرتبة الشرف 🌟";
    else if(v>=3.5) t="ممتاز";
    else if(v>=3) t="جيد جداً";
    else if(v>=2.5) t="جيد";
    else if(v>=2) t="مقبول";
    else t="راسب - شد حيلك";
  } else { // نسبة
    if(v>=90) t="ممتاز";
    else if(v>=80) t="جيد جداً";
    else if(v>=65) t="جيد";
    else if(v>=50) t="مقبول";
    else t="راسب";
  }
  r.innerHTML=t;
}
</script>
</body>
</html>
